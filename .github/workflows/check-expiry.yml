name: Check Email Expiry at 9:46 AM Algeria Time

on:
  # Run every hour to check if it's 9:46 AM Algeria time
  schedule:
    - cron: '46 8,9,10 * * *'  # Runs at 8:46, 9:46, 10:46 UTC = 9:46, 10:46, 11:46 Algeria
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      force_check:
        description: 'Force check (ignore time)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  check-expiry:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Check email expiry at 9:46 AM Algeria time
        run: npm run check
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP_URL: ${{ secrets.APP_URL || 'https://your-app.web.app' }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      
      - name: Log completion
        if: always()
        run: echo "✅ Check completed at $(date)"